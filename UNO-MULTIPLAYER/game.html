<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO Arena | Live Match</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Top Utility Bar -->
        <header class="game-topbar">
            <div class="room-indicator">
                <span class="dot"></span>
                <span>ROOM: <strong id="game-room-id">------</strong></span>
            </div>
            <div class="direction-indicator" id="direction-indicator" title="Current Play Direction">
                ↻ CLOCKWISE
            </div>
            <div class="topbar-controls">
                <button id="btn-sound-toggle" class="icon-btn" title="Toggle Sound">🔊</button>
                <button id="btn-leave-game" class="btn-sm btn-red">LEAVE</button>
            </div>
        </header>

        <!-- Arena Table -->
        <main class="arena-table">
            <!-- Opponents Row -->
            <section class="opponents-container" id="opponents-container">
                <!-- Dynamically populated opponent slots -->
            </section>

            <!-- Center Deck & Discard Zone -->
            <section class="center-play-area">
                <div class="deck-zone">
                    <div id="draw-pile" class="card card-back" role="button" title="Click to draw card">
                        <div class="card-inner">
                            <span class="card-logo-mini">UNO</span>
                        </div>
                    </div>
                    <span class="deck-label">DRAW PILE</span>
                </div>

                <div class="discard-zone">
                    <div id="discard-pile" class="card-slot">
                        <!-- Top played card gets rendered here -->
                    </div>
                    <div class="current-color-badge" id="current-color-badge">
                        COLOR: <span id="active-color-name">NONE</span>
                    </div>
                </div>
            </section>

            <!-- Turn Banner / Action Logger -->
            <div class="game-announcer" id="game-announcer">
                Loading game state...
            </div>

            <!-- Player Hand Area -->
            <section class="player-hand-container">
                <div class="hand-meta-bar">
                    <div class="your-info">
                        <span class="player-tag">YOU: <strong id="current-player-name">Player</strong></span>
                        <span class="hand-counter">Cards: <span id="your-card-count">0</span></span>
                    </div>
                    <div class="action-buttons-group">
                        <button id="btn-call-uno" class="btn-uno-alert" disabled>UNO!</button>
                        <button id="btn-catch-uno" class="btn-catch-uno" title="Catch a player who forgot to call UNO">CATCH UNO</button>
                        <button id="btn-pass-turn" class="btn-pass hidden">PASS TURN</button>
                    </div>
                </div>

                <div class="player-cards-scroll">
                    <div id="player-hand" class="cards-hand">
                        <!-- Rendered player cards -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Color Picker Modal for Wild Cards -->
    <div id="color-picker-modal" class="modal-overlay hidden">
        <div class="modal-content color-modal">
            <h2>CHOOSE A COLOR</h2>
            <div class="color-grid">
                <button class="color-choice-btn bg-red" data-color="red">RED</button>
                <button class="color-choice-btn bg-blue" data-color="blue">BLUE</button>
                <button class="color-choice-btn bg-green" data-color="green">GREEN</button>
                <button class="color-choice-btn bg-yellow" data-color="yellow">YELLOW</button>
            </div>
        </div>
    </div>

    <!-- Win Overlay Modal -->
    <div id="win-modal" class="modal-overlay hidden">
        <div class="modal-content victory-content">
            <div class="trophy-icon">🏆</div>
            <h2 id="winner-title">WINNER!</h2>
            <p id="winner-subtitle">Player conquered the arena!</p>
            <div class="game-stats-box">
                <p>Turns Played: <strong id="stat-turns">0</strong></p>
                <p>Cards Discarded: <strong id="stat-cards-played">0</strong></p>
            </div>
            <div class="button-stack">
                <button id="btn-play-again" class="btn btn-green">PLAY AGAIN</button>
                <button id="btn-exit-to-lobby" class="btn btn-outline">BACK TO MENU</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="game-toast" class="toast hidden"></div>

    <!-- Game Engine -->
    <script type="module" src="game.js"></script>
</body>
</html>
